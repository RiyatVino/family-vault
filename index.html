<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Family Vault — Document Manager</title>
<meta name="description" content="Offline-first family document vault. Store, organize, search and instantly share every family document, entirely on your device." />
<meta name="theme-color" content="#1F3D34" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Family Vault" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <div id="lockscreen-root"></div>

  <header class="topbar" id="topbar" hidden>
    <div>
      <div class="eyebrow" id="topbar-eyebrow">Family Vault</div>
      <h1 id="topbar-title">Home</h1>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-theme" title="Toggle dark mode">🌙</button>
      <button class="icon-btn" id="btn-lock" title="Lock vault">🔒</button>
    </div>
  </header>

  <main id="view" hidden></main>

  <button class="fab" id="fab-add" title="Add document" hidden>+</button>

  <nav class="bottomnav" id="bottomnav" hidden>
    <button data-tab="home" class="active"><span class="ic">🏠</span>Home</button>
    <button data-tab="members"><span class="ic">👪</span>Family</button>
    <button data-tab="search"><span class="ic">🔎</span>Search</button>
    <button data-tab="settings"><span class="ic">⚙️</span>Vault</button>
  </nav>

  <div id="sheet-root"></div>
  <div class="toast" id="toast"></div>
</div>

<script src="vendor/qrcode.js"></script>
<script src="vendor/fflate.js"></script>
<script src="js/db.js"></script>
<script src="js/crypto.js"></script>
<script src="js/zip-share.js"></script>
<script src="js/qr.js"></script>
<script src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
