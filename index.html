<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Family Vault — Document Manager</title>
<meta name="description" content="Offline-first family document vault. Store each family member's documents and share them instantly, entirely on your device." />
<meta name="theme-color" content="#3A6FF0" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Family Vault" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<div id="access-gate-root"></div>

<div id="app">
  <header class="topbar" id="topbar" hidden>
    <div>
      <div class="eyebrow" id="topbar-eyebrow">Family Vault</div>
      <h1 id="topbar-title">Family</h1>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-theme" title="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main id="view" hidden></main>

  <button class="fab" id="fab-add" title="Add" hidden>+</button>

  <div id="sheet-root"></div>
  <div class="toast" id="toast"></div>
</div>

<script src="js/access-gate.js"></script>
<script src="vendor/fflate.js"></script>
<script src="js/db.js"></script>
<script src="js/crypto.js"></script>
<script src="js/zip-share.js"></script>
<script src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
